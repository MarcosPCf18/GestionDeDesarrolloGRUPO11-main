# CI – Equipo 11
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el codigo del repositorio
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configura Node.js
      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Instala las dependencias del proyecto
      - name: Instalar dependencias
        run: npm ci

      # 4. Instala solo Chromium y sus dependencias
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive

      # 5. Ejecuta las pruebas automaticas
      - name: Ejecutar tests de Playwright
        run: npx playwright test

      # 6. Genera el informe de cobertura
      - name: Generar informe de cobertura
        run: npm run test:coverage

      # 7. Analiza el codigo con SonarCloud
      - name: Analizar codigo con SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # 8. Guarda el reporte de Playwright
      - name: Subir reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14