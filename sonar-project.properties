# Identificacion del proyecto en SonarQube Cloud
sonar.projectKey=gestiondedesarrollogrupo11
sonar.organization=gestiondedesarrollogrupo11

# Carpetas del codigo y las pruebas
sonar.sources=public
sonar.tests=tests

# Codificacion del codigo fuente
sonar.sourceEncoding=UTF-8

# Informe de cobertura generado por Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info


#sonar.projectKey: identifica el proyecto que creaste en SonarCloud.
#sonar.organization: identifica la organización de SonarCloud donde está registrado.
#sonar.sources=public: indica que el código de la aplicación está dentro de public.
#sonar.tests=tests: indica que las pruebas están dentro de tests.
#sonar.sourceEncoding=UTF-8: establece la codificación de los archivos de texto.